name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/gokulakrishh/dicomviewer-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: |
          VTK_DIR="$(find /opt/vtk -name VTKConfig.cmake -exec dirname {} \; | head -n 1)"
          test -n "$VTK_DIR"
          cmake -S . -B build-ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DDICOMVIEWER_ENABLE_VTK=ON \
            -DVTK_DIR="$VTK_DIR"

      - name: Build
        run: cmake --build build-ci --parallel

name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/gokulakrishh/dicomviewer-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: |
          if [ ! -f /opt/vtk/lib/cmake/vtk-9.5/VTKConfig.cmake ]; then
            echo "VTKConfig.cmake not found in /opt/vtk/lib/cmake/vtk-9.5" >&2
            find /opt/vtk -maxdepth 4 -name VTKConfig.cmake -print >&2 || true
            exit 1
          fi

          cmake -S . -B build-ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DDICOMVIEWER_ENABLE_VTK=ON \
            -DVTK_DIR=/opt/vtk/lib/cmake/vtk-9.5

      - name: Build
        run: cmake --build build-ci --parallel

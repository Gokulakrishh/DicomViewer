name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/gokulakrishh/dicomviewer-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inspect CI image
        run: |
          echo "CMake:"
          cmake --version

          echo "Qt:"
          qmake6 --version || true

          echo "VTK package config candidates:"
          find /opt /usr/local /usr \( -name VTKConfig.cmake -o -name vtk-config.cmake \) -print 2>/dev/null || true

          echo "/opt layout:"
          find /opt -maxdepth 4 -type d -print 2>/dev/null | sort | sed -n '1,160p' || true

      - name: Configure
        run: |
          VTK_DIR="$(find /opt /usr/local /usr \( -name VTKConfig.cmake -o -name vtk-config.cmake \) -exec dirname {} \; 2>/dev/null | head -n 1)"
          if [ -z "$VTK_DIR" ]; then
            echo "VTK package config not found in the container image" >&2
            find /opt /usr/local /usr \( -name VTKConfig.cmake -o -name vtk-config.cmake \) -print 2>/dev/null || true
            exit 1
          fi

          echo "Using VTK_DIR=$VTK_DIR"

          cmake -S . -B build-ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DDICOMVIEWER_ENABLE_VTK=ON \
            -DVTK_DIR="$VTK_DIR"

      - name: Build
        run: cmake --build build-ci --parallel

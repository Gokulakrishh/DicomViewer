[database]
; Optional. Leave empty to use the application data folder.
; Override with DICOMVIEWER_DATABASE_FILEPATH for development/CI if needed.
filePath=

[volumeValidation]
; Orientation vectors must align within this tolerance.
orientationAlignmentTolerance=0.001
; Pixel spacing and slice spacing differences smaller than this are accepted.
spacingTolerance=0.001
; Set false to allow irregular slice spacing for reconstruction.
validateUniformSliceSpacing=true

[ai]
provider=none
baseUrl=https://generativelanguage.googleapis.com
apiKey=
model=gemini-2.5-flash
defaultReasoningLevel=medium
requestTimeoutMs=30000
maxOutputTokens=4000
